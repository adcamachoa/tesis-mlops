[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Igual que en Databricks, donde el directorio del script (src/) entra al path: from common import ...
pythonpath = ["src"]
addopts = "-ra"
